<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Your Event</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #090b10;
    --surface: #111420;
    --surface2: #181c2a;
    --border: rgba(255,255,255,0.07);
    --border-bright: rgba(255,255,255,0.14);
    --accent: #c6ff00;
    --accent-dim: rgba(198,255,0,0.12);
    --accent-glow: rgba(198,255,0,0.35);
    --pink: #ff3e7f;
    --pink-dim: rgba(255,62,127,0.12);
    --text: #f0f0f8;
    --muted: rgba(240,240,248,0.45);
    --font-display: 'Bebas Neue', Impact, sans-serif;
    --font-mono: 'DM Mono', 'Courier New', monospace;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --radius: 14px;
    --radius-sm: 8px;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
    z-index: 0;
  }

  .panel {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  /* ─── HEADER ─── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 2.2rem;
    letter-spacing: 0.05em;
    color: var(--accent);
    line-height: 1;
  }

  .logo span { color: var(--pink); }

  .badge {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border-bright);
    padding: 5px 10px;
    border-radius: 100px;
  }

  /* ─── PIN OVERLAY ─── */
  #pinOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }

  .pin-box {
    width: 100%;
    max-width: 320px;
    text-align: center;
  }

  .pin-logo {
    font-family: var(--font-display);
    font-size: 2.6rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .pin-logo span { color: var(--pink); }

  .pin-event-name {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 36px;
    min-height: 18px;
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 10px;
  }

  .pin-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.18);
    background: transparent;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }

  .pin-dot.filled {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.15);
  }

  .pin-dot.error {
    background: var(--pink);
    border-color: var(--pink);
    animation: pinShake 0.4s ease;
  }

  @keyframes pinShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .pin-error {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pink);
    height: 18px;
    margin-bottom: 28px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .pin-error.show { opacity: 1; }

  .pin-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .pin-key {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-bottom: 3px solid rgba(0,0,0,0.4);
    border-radius: 14px;
    color: var(--text);
    font-family: var(--font-display);
    font-size: 2rem;
    letter-spacing: 0.04em;
    padding: 22px 0;
    cursor: pointer;
    transition: background 0.08s, transform 0.06s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .pin-key:hover { background: var(--surface2); border-color: var(--accent); }
  .pin-key:active { transform: translateY(2px); border-bottom-width: 1px; background: var(--surface2); }
  .pin-back { font-size: 1.4rem; color: var(--muted); }

  /* ─── SECTION LABEL ─── */
  .section-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

    /* CROWD INSIGHTS */
    .insights-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:32px}.insight-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.insight-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px}.insight-stat-val{font-family:var(--font-display);font-size:2rem;color:var(--accent);line-height:1}.insight-stat-lbl{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}.insights-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.insights-sub{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.insights-empty{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--font-mono);font-size:.65rem;line-height:1.7;color:var(--muted)}.manage-genre-row{display:grid;grid-template-columns:minmax(84px,1fr) 1.4fr 34px;align-items:center;gap:8px;margin:9px 0;font-family:var(--font-mono);font-size:.6rem}.manage-genre-track{height:8px;background:var(--bg);border-radius:20px;overflow:hidden}.manage-genre-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:20px}.manage-genre-pct{text-align:right;color:var(--accent)}.manage-activity{display:flex;align-items:flex-end;gap:4px;height:128px;border-bottom:1px solid var(--border-bright)}.manage-activity-bar{flex:1;background:linear-gradient(180deg,var(--accent),rgba(198,255,0,.2));border-radius:3px 3px 0 0}.manage-activity-meta{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--font-mono);font-size:.55rem;color:var(--muted);text-transform:uppercase}.insights-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:.58rem;color:var(--muted);line-height:1.6}@media(max-width:600px){.insight-stats{grid-template-columns:repeat(2,1fr)}.insights-grid{grid-template-columns:1fr}.insights-panel{padding:18px}}

  /* EVENT ACCESS */
  .access-panel{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius);padding:24px;margin-bottom:32px}.access-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.access-plan{font-family:var(--font-display);font-size:2rem;letter-spacing:.05em}.access-status{font-family:var(--font-mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border-bright);border-radius:99px;padding:6px 10px;color:var(--muted);white-space:nowrap}.access-status.active,.access-status.ready{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}.access-status.expired{color:var(--pink);border-color:var(--pink);background:var(--pink-dim)}.access-status.vip{color:#ffd166;border-color:#ffd166}.access-copy{color:var(--muted);line-height:1.65;font-size:.9rem;margin-bottom:18px}.btn-activate{width:100%;padding:17px;border:0;border-radius:var(--radius-sm);background:var(--accent);color:#090b10;font-family:var(--font-display);font-size:1.45rem;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 28px var(--accent-glow)}.countdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.count-unit{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 6px;text-align:center}.count-value{font-family:var(--font-display);font-size:2.2rem;color:var(--accent);line-height:1}.count-label{font-family:var(--font-mono);font-size:.48rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px}.access-progress{height:8px;background:var(--bg);border-radius:10px;overflow:hidden}.access-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink))}.access-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}.access-meta span{display:block;font-family:var(--font-mono);font-size:.52rem;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.access-meta strong{font-size:.78rem}.vip-infinity{font-family:var(--font-display);font-size:5rem;line-height:1;color:#ffd166;text-align:center}.vip-copy{text-align:center;font-family:var(--font-mono);font-size:.62rem;line-height:1.7;color:var(--muted)}.access-warning{background:var(--pink-dim);border:1px solid rgba(255,62,127,.35);border-radius:9px;padding:12px;font-size:.78rem;line-height:1.5}.activation-modal{position:fixed;inset:0;z-index:800;background:rgba(9,11,16,.93);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px}.activation-modal.open{display:flex}.activation-box{width:100%;max-width:470px;background:var(--surface);border:1px solid var(--border-bright);border-radius:18px;padding:28px}.activation-title{font-family:var(--font-display);font-size:2.3rem;color:var(--pink);margin:8px 0}.activation-text{color:var(--muted);line-height:1.65}.activation-list{margin:16px 0 20px;padding-left:20px;line-height:1.8;font-size:.84rem}.activation-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.activation-actions button{padding:13px;border-radius:9px;border:1px solid var(--border-bright);background:transparent;color:var(--muted);font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;cursor:pointer}.activation-actions .confirm{background:var(--pink);border-color:var(--pink);color:#fff}@media(max-width:600px){.count-value{font-size:1.6rem}.access-meta{grid-template-columns:1fr}.activation-actions{grid-template-columns:1fr}}
  /* RESPONSIVE MANAGE DASHBOARD */
  #mainContent.manage-dashboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px;align-items:start}
  .manage-access-section{grid-column:1;grid-row:1}.manage-share-section{grid-column:2;grid-row:1}.manage-insights-section{grid-column:1/-1;grid-row:2}.manage-edit-section{grid-column:1/-1;grid-row:3}
  .manage-access-section .access-panel,.manage-share-section .share-panel{margin-bottom:0}
  @media(max-width:760px){.panel{max-width:680px}#mainContent.manage-dashboard{display:block}.manage-access-section .access-panel,.manage-share-section .share-panel{margin-bottom:32px}}

  /* ─── FORM FIELDS ─── */
  .field-group {
    margin-bottom: 18px;
  }

  .field-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1.05rem;
    font-weight: 500;
    padding: 16px 18px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    box-sizing: border-box;
  }

  .field-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .field-input::placeholder { color: var(--muted); font-weight: 400; }

  textarea.field-input {
    resize: vertical;
    min-height: 150px;
    height: auto;
    max-height: 420px;
    overflow-y: hidden;
    line-height: 1.5;
  }

  /* PIN field */
  .pin-field-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .pin-field-row .field-input {
    max-width: 140px;
    letter-spacing: 0.2em;
    font-size: 1.3rem;
    text-align: center;
    font-family: var(--font-mono);
  }

  .btn-random-pin {
    padding: 0 18px;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn-random-pin:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── THEME SWATCHES ─── */
  .theme-swatches {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .theme-swatch {
    flex: 1;
    min-width: 80px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border-bright);
    padding: 10px 8px 8px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
    position: relative;
    text-align: center;
  }

  .theme-swatch:hover { transform: translateY(-2px); }
  .theme-swatch.selected { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
  .theme-swatch input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }

  .swatch-preview {
    width: 100%;
    height: 36px;
    border-radius: 6px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .swatch-dot { width: 8px; height: 8px; border-radius: 50%; }

  .swatch-name {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .theme-swatch.selected .swatch-name { color: var(--accent); }

  .selected-tick {
    position: absolute;
    top: 5px;
    right: 7px;
    font-size: 0.7rem;
    color: var(--accent);
    opacity: 0;
  }

  .theme-swatch.selected .selected-tick { opacity: 1; }

  /* Custom colours */
  .custom-color-panel {
    display: none;
    margin-top: 12px;
    padding: 14px;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
  }

  .custom-color-panel.open { display: block; }

  .color-picker-grid {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .color-picker-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }

  .color-picker-label {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .color-swatch-input {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: 2px solid var(--border-bright);
    padding: 2px;
    background: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .color-swatch-input:hover { border-color: var(--accent); }

  /* ─── SAVE BUTTON ─── */
  .btn-save {
    width: 100%;
    padding: 20px;
    background: var(--accent);
    color: #0a0a0f;
    font-family: var(--font-display);
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    box-shadow: 0 0 28px var(--accent-glow);
    transition: box-shadow 0.2s, transform 0.1s;
    margin-top: 8px;
  }

  .btn-save:hover { box-shadow: 0 0 44px rgba(198,255,0,0.55); transform: translateY(-1px); }
  .btn-save:active { transform: scale(0.98); }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .save-status {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 12px;
    height: 16px;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .save-status.show { opacity: 1; }

  /* ─── QR / SHARE PANEL ─── */
  .share-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 32px;
  }

  .share-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .share-row:last-child { margin-bottom: 0; }

  .share-label {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
    width: 52px;
  }

  .share-url {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text);
    word-break: break-all;
    min-width: 0;
  }

  .btn-url-copy {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-bright);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-url-copy:hover { border-color: var(--accent); color: var(--accent); }
  .btn-url-copy.copied { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .qr-row {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .qr-thumb {
    background: #fff;
    border-radius: 8px;
    padding: 8px;
    line-height: 0;
    flex-shrink: 0;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .qr-thumb:hover { transform: scale(1.06); }
  .qr-thumb canvas, .qr-thumb img { display: block; }

  .qr-hint {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    line-height: 1.6;
    padding-top: 4px;
  }

  /* ─── DIVIDER ─── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  /* ─── NO EVENT ─── */
  .no-event {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* ─── ZOOM MODAL (reused from main) ─── */
  #qrZoomModal {
    position: fixed;
    inset: 0;
    background: rgba(9,11,16,0.94);
    backdrop-filter: blur(10px);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }

  #qrZoomModal.open { display: flex; }

  .qr-zoom-box {
    position: relative;
    background: #fff;
    border-radius: 20px;
    padding: 28px 28px 22px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  .qr-zoom-timer { position: absolute; top: 14px; left: 18px; font-family: monospace; font-size: 0.62rem; color: #aaa; }

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBOdgG_AE1Rng88eoH5bLue1eY9VMwAsOc",
  authDomain:        "dj-request-gt.firebaseapp.com",

};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const PIN_API_BASE = 'https://djreqit-pin.grahamthorne.workers.dev';

// ─── URL PARAMS
const eventIdRaw = new URLSearchParams(window.location.search).get('event');
  const eventId = eventIdRaw ? eventIdRaw.trim().toUpperCase() : '';
  const EVENT_CODE_RE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/;
  let eventAuthorised = false;
let eventData = {};
const sessionKey = `djrequest_session_${eventId}`;

// ─── COMPUTE BASE URLS
const base     = window.location.origin + window.location.pathname.replace(/\/manage\.html$/, '/');
const guestUrl = base + 'event.html?event=' + eventId;
const boothUrl = base + 'event.html?mode=dj&event=' + eventId;
const manageUrl = window.location.href;

// ─── PIN LOGIC
let pinEntry = '';

function pinPress(d) {
  if (pinEntry.length >= 4) return;
  pinEntry += d;
  updateDots();
  if (pinEntry.length === 4) checkPin();
}

function pinBack() {
  pinEntry = pinEntry.slice(0, -1);
  updateDots();
  document.getElementById('pinError').classList.remove('show');
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('pd' + i);
    dot.classList.toggle('filled', i < pinEntry.length);
    dot.classList.remove('error');
  }
}

async function checkPin() {
  if (!eventData || !eventId || pinEntry.length !== 4) return;
  const pinError = document.getElementById('pinError');
  pinError.textContent = 'Checking PIN…';
  pinError.classList.add('show');
  setPinKeysDisabled(true);
  try {
    const response = await fetch(`${PIN_API_BASE}/api/event/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ eventId, pin: pinEntry })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || !result.success || !result.token) throw new Error(result.message || 'Incorrect PIN — try again');
    sessionStorage.setItem(sessionKey, result.token);
    authoriseManagement();
  } catch (error) {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('pd' + i);
      dot.classList.remove('filled');
      dot.classList.add('error');
    }
    pinError.textContent = error.message || 'Incorrect PIN — try again';
    setTimeout(() => {
      pinEntry = '';
      updateDots();
      pinError.classList.remove('show');
      pinError.textContent = 'Incorrect PIN — try again';
      setPinKeysDisabled(false);
    }, 1200);
  }
}
function setPinKeysDisabled(disabled) {
  document.querySelectorAll('.pin-key').forEach(button => button.disabled = disabled);
}
function authoriseManagement() {
  eventAuthorised = true;
  const overlay = document.getElementById('pinOverlay');
  if (overlay) {
    overlay.style.transition = 'opacity 0.3s';
    overlay.style.opacity = '0';
    setTimeout(() => overlay.remove(), 320);
  }
  renderManagePanel();
}
async function restoreManagementSession() {
  const token = sessionStorage.getItem(sessionKey);
  if (!token) return false;
  try {
    const response = await fetch(`${PIN_API_BASE}/api/event/session`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || !result.authenticated || result.eventId !== eventId) {
      sessionStorage.removeItem(sessionKey);
      return false;
    }
    authoriseManagement();
    return true;
  } catch {
    sessionStorage.removeItem(sessionKey);
    return false;
  }
}
async function logoutManagement() {
  const token = sessionStorage.getItem(sessionKey);
  sessionStorage.removeItem(sessionKey);
  if (token) fetch(`${PIN_API_BASE}/api/event/logout`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }).catch(() => {});
  window.location.reload();
}

// Physical keyboard
document.addEventListener('keydown', e => {
  const overlay = document.getElementById('pinOverlay');
  if (overlay) {
    if (e.key >= '0' && e.key <= '9') pinPress(e.key);

});

// ─── INIT: load event, validate it exists and has a PIN
if (!eventId) {
  document.getElementById('pinOverlay').remove();

} else {
  db.ref('events/' + eventId).get().then(snap => {
    const data = snap.val();
    if (!data) {
      document.getElementById('pinOverlay').remove();
      document.getElementById('mainContent').innerHTML =
        '<div class="no-event">Event not found.<br>This event may have been deleted by the admin.</div>';
      return;
    }
eventData = data;
    document.getElementById('pinEventLabel').textContent =
      `"${data.name || 'Your Event'}" — Enter PIN`;
    document.title = `Manage — ${data.name || 'Event'}`;

  }).catch(() => {
    document.getElementById('pinOverlay').remove();
    document.getElementById('mainContent').innerHTML =
      '<div class="no-event">Could not load event.<br>Check your internet connection.</div>';
  });
}


// ─── EVENT ACCESS / ACTIVATION
let accessTimer=null;
function accessState(){const a=eventData.access||{};return{type:a.type||eventData.accessType||(eventData.vip===true?'vip':'legacy'),days:Number(a.planDays||eventData.planDays||0),paid:a.paymentStatus==='paid'||eventData.paymentStatus==='paid'||a.paid===true,activated:a.activated===true||Number(a.activatedAt||eventData.activatedAt||0)>0,started:Number(a.activatedAt||eventData.activatedAt||0),ends:Number(a.expiresAt||eventData.expiresAt||0)}}
function accessDate(ms){return ms?new Date(ms).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}
function renderAccessWidget(){const el=document.getElementById('eventAccessWidget');if(!el)return;clearInterval(accessTimer);const a=accessState();if(a.type==='vip'){el.innerHTML='<div class="access-head"><div class="access-plan">VIP Event</div><div class="access-status vip">★ Always Active</div></div><div class="vip-infinity">∞</div><div class="vip-copy">THIS EVENT DOES NOT EXPIRE<br>NO ACTIVATION OR COUNTDOWN REQUIRED</div>';return}if(![7,15,45].includes(a.days)){el.innerHTML='<div class="access-head"><div class="access-plan">Event Access</div><div class="access-status">Legacy Event</div></div><div class="access-copy">This event predates paid activation and remains available.</div><div class="access-warning">A 7, 15 or 45-day entitlement must be assigned by Stripe/Cloudflare before activation becomes available.</div>';return}if(!a.paid){el.innerHTML=`<div class="access-head"><div class="access-plan">${a.days} Day Pass</div><div class="access-status">Payment Required</div></div><div class="access-copy">Payment has not yet been confirmed. The countdown has not started.</div>`;return}if(!a.activated){el.innerHTML=`<div class="access-head"><div class="access-plan">${a.days} Day Pass</div><div class="access-status ready">Ready to Activate</div></div><div class="access-copy"><strong style="color:var(--text)">✓ Payment confirmed.</strong><br>Your countdown has not started. Activate only when you are ready.</div><button class="btn-activate" onclick="openActivationModal()">Activate Event →</button>`;return}const tick=()=>{const left=Math.max(0,a.ends-Date.now()),expired=left<=0,d=Math.floor(left/86400000),h=Math.floor(left%86400000/3600000),m=Math.floor(left%3600000/60000),sec=Math.floor(left%60000/1000),pc=Math.max(0,Math.min(100,left/(a.days*86400000)*100));el.innerHTML=`<div class="access-head"><div class="access-plan">${a.days} Day Pass</div><div class="access-status ${expired?'expired':'active'}">${expired?'Expired':'● Active'}</div></div>${expired?'<div class="vip-infinity" style="font-size:3rem;color:var(--pink)">Expired</div>':`<div class="countdown-grid">${[[d,'Days'],[h,'Hours'],[m,'Minutes'],[sec,'Seconds']].map(([v,l])=>`<div class="count-unit"><div class="count-value">${String(v).padStart(2,'0')}</div><div class="count-label">${l}</div></div>`).join('')}</div><div class="access-progress"><div class="access-progress-fill" style="width:${pc}%"></div></div>`}<div class="access-meta"><div><span>Activated</span><strong>${accessDate(a.started)}</strong></div><div><span>Expires</span><strong>${accessDate(a.ends)}</strong></div></div>`;if(expired)clearInterval(accessTimer)};tick();accessTimer=setInterval(tick,1000)}
function openActivationModal(){const a=accessState();if(!a.paid||a.activated||![7,15,45].includes(a.days))return;document.getElementById('activationText').innerHTML=`You are about to activate your <strong style="color:var(--text)">${a.days} Day Event Pass</strong>. Only continue if you are ready for the paid period to begin.`;document.getElementById('activationModal').classList.add('open')}
function closeActivationModal(){document.getElementById('activationModal').classList.remove('open')}
async function confirmActivation(){const a=accessState(),b=document.getElementById('confirmActivationBtn');if(!a.paid||a.activated||![7,15,45].includes(a.days))return;b.disabled=true;b.textContent='Activating…';try{const started=Date.now(),ends=started+a.days*86400000;await db.ref('events/'+eventId).update({active:true,'access/activated':true,'access/activatedAt':started,'access/expiresAt':ends,activatedAt:started,expiresAt:ends});eventData={...eventData,active:true,activatedAt:started,expiresAt:ends,access:{...(eventData.access||{}),activated:true,activatedAt:started,expiresAt:ends}};closeActivationModal();renderAccessWidget()}catch(e){alert('Activation failed: '+e.message)}finally{b.disabled=false;b.textContent='Yes, Activate Now'}}
document.getElementById('activationModal').addEventListener('click',e=>{if(e.target.id==='activationModal')closeActivationModal()});

// ─── CROWD INSIGHTS
let insightsStarted=false,managePending=[],manageHistory=[];
function insightGenre(value){const g=String(value||'').trim().toLowerCase();if(!g)return '';const t=[['Dance / House',/(house|dance|edm|club|techno|trance|garage)/],['Pop',/(pop|k-pop)/],['Disco / Funk',/(disco|funk)/],['R&B / Soul',/(r&b|rnb|soul|motown)/],['Hip-Hop / Rap',/(hip.?hop|rap|grime|drill)/],['Indie / Rock',/(indie|rock|metal|punk|alternative)/],['Reggae',/(reggae|dancehall|ska)/],['Country',/(country|americana)/],['Latin',/(latin|salsa|reggaeton)/],['Electronic',/(electronic|ambient|drum.?and.?bass|dnb|dubstep)/]];for(const [l,r] of t)if(r.test(g))return l;return g.replace(/\b\w/g,c=>c.toUpperCase()).slice(0,22)}
function startManageInsights(){if(insightsStarted)return;insightsStarted=true;db.ref('events/'+eventId+'/requests').on('value',s=>{managePending=Object.values(s.val()||{});renderManageInsights()});db.ref('events/'+eventId+'/history').on('value',s=>{manageHistory=Object.values(s.val()||{});renderManageInsights()})}
function renderManageInsights(){const el=document.getElementById('manageInsights');if(!el)return;const all=[...manageHistory,...managePending].filter(r=>r&&r.time),played=manageHistory.filter(r=>r.status==='Played').length,rejected=manageHistory.filter(r=>r.status==='Rejected').length;if(all.length<2){el.innerHTML='<div class="insights-empty">Not enough data yet.<br>Crowd insights will appear as requests come in.</div>';return}const counts={};all.filter(r=>String(r.genre||'').trim()).forEach(r=>{const g=insightGenre(r.genre);if(g)counts[g]=(counts[g]||0)+(Number(r.votes)||1)});const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6),total=Object.values(counts).reduce((a,b)=>a+b,0);const times=all.map(r=>Number(r.time)).filter(Number.isFinite),start=Math.min(...times),span=Math.max(3600000,Date.now()-start),bins=Array(16).fill(0);times.forEach(t=>{const i=Math.max(0,Math.min(15,Math.floor((t-start)/span*16)));bins[i]++});const max=Math.max(1,...bins);el.innerHTML=`<div class="insight-stats"><div class="insight-stat"><div class="insight-stat-val">${all.length}</div><div class="insight-stat-lbl">Total requests</div></div><div class="insight-stat"><div class="insight-stat-val">${managePending.length}</div><div class="insight-stat-lbl">Pending</div></div><div class="insight-stat"><div class="insight-stat-val">${played}</div><div class="insight-stat-lbl">Played</div></div><div class="insight-stat"><div class="insight-stat-val">${rejected}</div><div class="insight-stat-lbl">Rejected</div></div></div><div class="insights-grid"><div><div class="insights-sub">Crowd picks by genre</div>${ranked.length?ranked.map(([g,n])=>{const pc=Math.round(n/total*100);return `<div class="manage-genre-row"><div>${escHtml(g)}</div><div class="manage-genre-track"><div class="manage-genre-fill" style="width:${pc}%"></div></div><div class="manage-genre-pct">${pc}%</div></div>`}).join(''):'<div class="insights-empty">Not enough genre data yet.</div>'}</div><div><div class="insights-sub">Request activity</div><div class="manage-activity">${bins.map(n=>`<div class="manage-activity-bar" style="height:${n?Math.max(8,Math.round(n/max*100)):2}%" title="${n} request${n===1?'':'s'}"></div>`).join('')}</div><div class="manage-activity-meta"><span>First request</span><span>Now</span></div></div></div><div class="insights-note">Genre percentages include pending, played and rejected requests. Repeat votes count towards crowd demand.</div>`}

      <textarea class="field-input" id="editDesc" maxlength="1000" rows="5"
        placeholder="e.g. No dubstep please! / Welcome everyone 🎉">${escHtml(eventData.description || '')}</textarea>
    </div>

    <div class="field-group" style="background:var(--surface2);border:1px solid var(--border-bright);border-radius:var(--radius);padding:14px 16px;color:var(--muted);font-family:var(--font-mono);font-size:0.65rem;line-height:1.6;">
      🔒 Your management PIN is checked securely by DJRequest.it and is no longer loaded into this page.
    </div>

          <input type="color" id="cc-surface"   value="${eventData.customColors?.surface   || '#111420'}" class="color-swatch-input"></label>
        <label class="color-picker-item"><span class="color-picker-label">Accent</span>
          <input type="color" id="cc-accent"    value="${eventData.customColors?.accent    || '#c6ff00'}" class="color-swatch-input"></label>
        <label class="color-picker-item"><span class="color-picker-label">Secondary</span>
          <input type="color" id="cc-secondary" value="${eventData.customColors?.secondary || '#ff3e7f'}" class="color-swatch-input"></label>
        <label class="color-picker-item"><span class="color-picker-label">Body Text</span>
          <input type="color" id="cc-text"      value="${eventData.customColors?.text      || '#f0f0f8'}" class="color-swatch-input"></label>
        <label class="color-picker-item"><span class="color-picker-label">Headings</span>
          <input type="color" id="cc-heading"   value="${eventData.customColors?.heading   || '#f0f0f8'}" class="color-swatch-input"></label>
        <label class="color-picker-item"><span class="color-picker-label">Subtitles</span>
          <input type="color" id="cc-body"      value="${eventData.customColors?.body      || '#7f8ea3'}" class="color-swatch-input"></label>
      </div>
    </div>

    <div style="margin-top:24px;">
      <button class="btn-save" id="saveBtn" onclick="saveChanges()">Save Changes →</button>
      <div class="save-status" id="saveStatus">✓ Saved successfully</div>
    </div>`;

  main.appendChild(editSection);

  const descBox = document.getElementById('editDesc');
  if (descBox) {
    const autoGrowDesc = () => {
      descBox.style.height = 'auto';
      descBox.style.height = Math.min(descBox.scrollHeight, 420) + 'px';
      descBox.style.overflowY = descBox.scrollHeight > 420 ? 'auto' : 'hidden';
    };
    descBox.addEventListener('input', autoGrowDesc);
    requestAnimationFrame(autoGrowDesc);
  }
}

function themeSwatchHtml(value, selected) {
  const swatches = {
    neon:     { bg: '#090b10', d1: '#c6ff00', d2: '#ff3e7f', label: 'Neon' },
    midnight: { bg: '#07090f', d1: '#4fc3f7', d2: '#c084fc', label: 'Midnight' },
    light:    { bg: '#f1f5f9', d1: '#6d28d9', d2: '#db2777', label: 'Light', border: '1px solid rgba(0,0,0,.08)' },
    custom:   { bg: 'linear-gradient(135deg,#1a0533,#2d1b69)', d1: null, d2: null, label: 'Custom', emoji: '🎨' }
  };
  const s = swatches[value];
  const preview = s.emoji
    ? `<span style="font-size:1rem;">${s.emoji}</span>`
    : `<div class="swatch-dot" style="background:${s.d1}"></div><div class="swatch-dot" style="background:${s.d2}"></div>`;

  return `
    <label class="theme-swatch ${selected ? 'selected' : ''}" onclick="selectTheme('${value}', this)">
      <input type="radio" name="theme" value="${value}" ${selected ? 'checked' : ''}>
      <div class="selected-tick">✓</div>
      <div class="swatch-preview" style="background:${s.bg};${s.border ? 'border:' + s.border : ''}">${preview}</div>
      <div class="swatch-name">${s.label}</div>
    </label>`;
}

// ─── THEME PICKER
function selectTheme(value, label) {
  document.querySelectorAll('#themeSwatches .theme-swatch').forEach(s => s.classList.remove('selected'));
  label.classList.add('selected');
  label.querySelector('input').checked = true;
  document.getElementById('customColors')?.classList.toggle('open', value === 'custom');
}

// ─── SAVE
function saveChanges() {
  const name = document.getElementById('editName')?.value.trim();
  if (!name) { document.getElementById('editName')?.focus(); return; }
  if (!eventAuthorised || !sessionStorage.getItem(sessionKey)) {
    alert('Your management session has expired. Please log in again.');
    window.location.reload();
    return;
  }

  const theme = document.querySelector('input[name="theme"]:checked')?.value || 'neon';
  const desc  = document.getElementById('editDesc')?.value.trim();

  const btn = document.getElementById('saveBtn');
  btn.disabled    = true;
  btn.textContent = 'Saving…';


  const updates = { name, theme };
  if (desc)         updates.description  = desc;         else updates.description  = null;

  if (theme === 'custom') {
    updates.customColors = {
      bg:        document.getElementById('cc-bg')?.value        || '#090b10',
      surface:   document.getElementById('cc-surface')?.value   || '#111420',
      accent:    document.getElementById('cc-accent')?.value    || '#c6ff00',
      secondary: document.getElementById('cc-secondary')?.value || '#ff3e7f',
      text:      document.getElementById('cc-text')?.value      || '#f0f0f8',
      heading:   document.getElementById('cc-heading')?.value   || '#f0f0f8',
      body:      document.getElementById('cc-body')?.value      || '#7f8ea3',
    };
  } else {
    updates.customColors = null;
  }

  db.ref('events/' + eventId).update(updates)
    .then(() => {
      eventData  = { ...eventData, ...updates };
      document.getElementById('headerEventName').textContent = name;
      btn.disabled    = false;
      btn.textContent = 'Save Changes →';
      // Show overlay confirmation
      const confirm = document.getElementById('saveConfirm');
      confirm.classList.add('show');
      setTimeout(() => confirm.classList.remove('show'), 2400);
    })
    .catch(err => {
      btn.disabled    = false;
      btn.textContent = 'Save Changes →';
      alert('Save failed: ' + err.message);
    });
}

// ─── COPY URL
function copyUrl(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ─── QR ZOOM
let qrZoomTimer = null;

function openQrZoom(url, name) {
  const modal  = document.getElementById('qrZoomModal');
  const canvas = document.getElementById('qrZoomCanvas');
  canvas.innerHTML = '';
  new QRCode(canvas, { text: url, width: 300, height: 300,
    colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.H });
  document.getElementById('qrZoomName').textContent = name;
  document.getElementById('qrZoomUrl').textContent  = url;
  modal.classList.add('open');
  startZoomTimer();
  modal.addEventListener('pointermove', resetZoomTimer, { passive: true });
  modal.addEventListener('touchstart',  resetZoomTimer, { passive: true });
}

function closeQrZoom() {
  document.getElementById('qrZoomModal').classList.remove('open');
  clearTimeout(qrZoomTimer);
}

function startZoomTimer() {
  let r = 30;
  const el = document.getElementById('qrZoomTimer');
  clearInterval(qrZoomTimer);
  qrZoomTimer = setInterval(() => {
    if (el) el.textContent = `Closes in ${r}s`;
    if (r-- <= 0) { clearInterval(qrZoomTimer); closeQrZoom(); }
  }, 1000);
}

function resetZoomTimer() { startZoomTimer(); }

document.getElementById('qrZoomModal').addEventListener('click', e => {
  if (e.target === document.getElementById('qrZoomModal')) closeQrZoom();
});

// ─── HELPER
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
